# Runs every check on each push to main and on every pull request.
# Uses only the local Supabase stack inside the runner: no secrets, no hosted services.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  app:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: building never contacts Supabase (session reads happen at request time).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Type-check the Edge Functions (Deno)
        run: npm run functions:check
      - run: npm test
      - run: npm run build

  database-and-browser:
    name: Database and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Read by the local Edge Runtime when the stack starts.
      - name: Give the dispatcher a throwaway secret
        run: printf 'DISPATCH_SECRET=%s\nAPP_URL=http://localhost:3000\n' "$(openssl rand -hex 32)" > supabase/functions/.env

      - name: Start local Supabase (applies every migration from scratch)
        run: npm run db:start
      - name: Database tests (pgTAP)
        run: npm run db:test
      - name: Database function lint
        run: npm run db:lint

      - name: Point the app at the local stack
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase.json"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/supabase.json")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/supabase.json")"
            echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY "$RUNNER_TEMP/supabase.json")"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
          } > .env.local
          if grep -qE '=(null)?$' .env.local; then
            echo "::error::Could not read the local Supabase URL/keys from 'supabase status'"
            exit 1
          fi

      - name: Configure the dispatcher schedule (Vault)
        run: npm run dispatch:setup
      - name: Dispatcher integration tests (Edge Function, log-only provider)
        run: npm run test:integration

      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (Playwright; builds and starts the app)
        run: npm run e2e

      - name: Keep the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
